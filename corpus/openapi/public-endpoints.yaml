# Borderline API-OAS-003: explicit opt-outs and optional auth. /health and /login are
# *intentionally* public — the rule still reports them (by design) for human review.
openapi: 3.0.3
info:
  title: Mixed public and private
  version: "1.0"
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: OK
  /login:
    post:
      security: []
      responses:
        "200":
          description: OK
  /catalog:
    get:
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /account:
    get:
      responses:
        "200":
          description: OK
        "429":
          description: Too many requests
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
