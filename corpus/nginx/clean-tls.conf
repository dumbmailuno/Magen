# Clean: HTTP->HTTPS redirect, modern TLS, security headers, rate limiting, restricted
# status endpoint, denied VCS paths, a raised body limit only where uploads need it.
user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    server_tokens off;
    client_max_body_size 10m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name api.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.example.com;
        ssl_certificate     /etc/ssl/api.crt;
        ssl_certificate_key /etc/ssl/api.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5:!RC4;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }

        location ~ /\.(git|env) {
            deny all;
        }

        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        location /uploads {
            client_max_body_size 50m;
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
