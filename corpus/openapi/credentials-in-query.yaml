# API-OAS-010: credentials in query strings / paths, including a shared $ref'd parameter
# used twice (reported once). Negatives: q, tokens_count (query), X-Session-Id (header).
openapi: 3.0.3
info:
  title: Credentials in URLs
  version: "1.0"
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /search:
    get:
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: password
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/TokenParam"
      responses:
        "200":
          description: OK
        "429":
          description: Too many requests
  /export:
    get:
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - name: tokens_count
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /reset/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      responses:
        "204":
          description: Done
  /profile:
    get:
      parameters:
        - name: X-Session-Id
          in: header
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TokenParam:
      name: access_token
      in: query
      schema:
        type: string
