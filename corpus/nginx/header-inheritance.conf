# NGX-TLS-003 / NGX-HDR-002 via add_header inheritance: a location with ANY add_header
# loses every header set on the server. Negatives: a location that inherits, and one that
# re-declares what it needs (CSP frame-ancestors instead of X-Frame-Options).
events {}

http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 443 ssl;
        server_name app.example.com;
        limit_req zone=api;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location / {
            proxy_pass http://app;
        }

        location /api/ {
            add_header Cache-Control "no-store";
            proxy_pass http://api;
        }

        location /embed/ {
            add_header Strict-Transport-Security "max-age=63072000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "frame-ancestors https://partner.example.com" always;
            proxy_pass http://app;
        }

        location /legacy/ {
            add_header Strict-Transport-Security "max-age=0";
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            proxy_pass http://app;
        }
    }
}
