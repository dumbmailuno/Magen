# sites-available/app.conf — included from a main nginx.conf that was NOT provided, and it
# pulls headers from a snippet we cannot see. "Missing" findings are therefore
# inconclusive, not potential.
server {
    listen 443 ssl;
    server_name app.example.com;
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://app;
    }
}
