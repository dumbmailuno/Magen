# Ground truth for the evaluation corpus (format: docs/evaluation.md).
#
# Labelling procedure (corpus v1, 2026-11-22): each file was written to exercise specific
# rules; expected findings were authored from the rule definitions in docs/rules.md BEFORE
# running the analyzer. A match is (rule_id, location.pointer). `borderline: true` marks
# findings that are correct per the rule's definition but a human might reasonably accept
# (known false-positive sources, see docs/evaluation.md).
#
# Corpus v1 doubles as the development set the rules were written against, so scores on it
# measure regressions, not generalisation. A held-out set is planned (docs/evaluation.md).

version: 1
files:
  - file: openapi/clean-bearer.yaml
    kind: clean
    expected: []

  - file: openapi/clean.json
    kind: clean
    expected: []

  - file: openapi/tricky-refs.yaml
    kind: tricky
    expected: []

  - file: openapi/insecure-transport.yaml
    kind: vulnerable
    expected:
      - { rule_id: API-OAS-001, pointer: /servers/1/url, status: potential }
      - { rule_id: API-OAS-001, pointer: /servers/3/url, status: potential }
      - { rule_id: API-OAS-001, pointer: /paths/~1users/servers/0/url, status: potential }

  - file: openapi/no-auth.yaml
    kind: vulnerable
    expected:
      - { rule_id: API-OAS-002, pointer: /openapi, status: potential }
      - { rule_id: API-OAS-003, pointer: /paths/~1orders/get, status: potential }
      - { rule_id: API-OAS-003, pointer: /paths/~1orders/post, status: potential }
      - { rule_id: API-OAS-003, pointer: "/paths/~1orders~1{id}/delete", status: potential }
      - { rule_id: API-OAS-008, pointer: /paths, status: potential }

  - file: openapi/weak-schemes.yaml
    kind: vulnerable
    expected:
      - { rule_id: API-OAS-004, pointer: /components/securitySchemes/basicAuth, status: potential }
      - { rule_id: API-OAS-005, pointer: /components/securitySchemes/queryKey, status: potential }
      - { rule_id: API-OAS-006, pointer: /components/securitySchemes/oauth/flows/implicit, status: potential }
      - { rule_id: API-OAS-006, pointer: /components/securitySchemes/oauth/flows/password, status: potential }
      - { rule_id: API-OAS-007, pointer: /security/1/bearerAuth, status: potential }
      - { rule_id: API-OAS-007, pointer: /paths/~1me/get/security/1/BasicAuth, status: potential }

  - file: openapi/public-endpoints.yaml
    kind: tricky
    expected:
      - { rule_id: API-OAS-003, pointer: /paths/~1health/get/security, status: potential, borderline: true }
      - { rule_id: API-OAS-003, pointer: /paths/~1login/post/security, status: potential, borderline: true }
      - { rule_id: API-OAS-003, pointer: /paths/~1catalog/get/security, status: potential }

  - file: openapi/leaky-errors.yaml
    kind: vulnerable
    expected:
      - { rule_id: API-OAS-009, pointer: /components/schemas/Error/properties/stackTrace, status: potential }
      - { rule_id: API-OAS-009, pointer: /components/schemas/Debug/properties/exception, status: potential }

  - file: openapi/credentials-in-query.yaml
    kind: vulnerable
    expected:
      - { rule_id: API-OAS-010, pointer: /paths/~1search/get/parameters/1, status: potential }
      - { rule_id: API-OAS-010, pointer: /components/parameters/TokenParam, status: potential }
      - { rule_id: API-OAS-010, pointer: "/paths/~1reset~1{token}/parameters/0", status: potential }

  # ---- Nginx (corpus v1, 2026-11-22; same procedure as above) ----------------------------
  # Nginx pointers: directive names from the root with the index among same-named
  # siblings, e.g. /http/0/server/0/location/1.

  - file: nginx/clean-tls.conf
    kind: clean
    expected: []

  - file: nginx/legacy-tls.conf
    kind: vulnerable
    expected:
      - { rule_id: NGX-TLS-001, pointer: /http/0/server/0/ssl_protocols/0, status: potential }
      - { rule_id: NGX-TLS-002, pointer: /http/0/server/0/ssl_ciphers/0, status: potential }
      - { rule_id: NGX-TLS-003, pointer: /http/0/server/0, status: potential }

  - file: nginx/plaintext.conf
    kind: vulnerable
    expected:
      - { rule_id: NGX-TLS-004, pointer: /http/0/server/0, status: potential }
      - { rule_id: NGX-TLS-004, pointer: /http/0/server/3, status: potential }

  - file: nginx/exposure.conf
    kind: vulnerable
    expected:
      - { rule_id: NGX-CFG-003, pointer: /http/0/client_max_body_size/0, status: potential }
      - { rule_id: NGX-CFG-003, pointer: /http/0/server/0/location/5/client_max_body_size/0, status: potential }
      - { rule_id: NGX-CFG-001, pointer: /http/0/server/0/location/0/autoindex/0, status: potential }
      - { rule_id: NGX-CFG-002, pointer: /http/0/server/0/location/1, status: potential }
      - { rule_id: NGX-CFG-002, pointer: /http/0/server/0/location/2, status: potential }

  - file: nginx/header-inheritance.conf
    kind: tricky
    expected:
      - { rule_id: NGX-TLS-003, pointer: /http/0/server/0/location/1, status: potential }
      - { rule_id: NGX-TLS-003, pointer: /http/0/server/0/location/3, status: potential }
      - { rule_id: NGX-HDR-002, pointer: /http/0/server/0/location/1, status: potential }

  - file: nginx/cors.conf
    kind: vulnerable
    expected:
      - { rule_id: NGX-CORS-001, pointer: /http/0/server/0/location/0/add_header/3, status: potential }
      - { rule_id: NGX-CORS-001, pointer: /http/0/server/0/location/1/add_header/3, status: potential }

  - file: nginx/site-snippet.conf
    kind: tricky
    expected:
      - { rule_id: NGX-HDR-001, pointer: /server/0, status: inconclusive }
      - { rule_id: NGX-TLS-003, pointer: /server/0, status: inconclusive }
      - { rule_id: NGX-HDR-002, pointer: /server/0, status: inconclusive }
      - { rule_id: NGX-RL-001, pointer: /server/0, status: inconclusive }

  # ---- Runtime (corpus v1, 2026-11-22) -----------------------------------------------------
  # Recorded, redacted probe observations replayed through the runtime rules (no network).
  # Pointers are probe ids. Runtime findings are directly observed → status confirmed.

  - file: runtime/hardened-api.json
    kind: clean
    expected: []

  - file: runtime/legacy-server.json
    kind: vulnerable
    expected:
      - { rule_id: API-RT-001, pointer: "probe:plain-http", status: confirmed }
      - { rule_id: API-RT-002, pointer: "probe:tls-legacy", status: confirmed }
      - { rule_id: API-RT-003, pointer: "probe:tls-verify", status: confirmed }
      - { rule_id: API-RT-004, pointer: "probe:base-get", status: confirmed }
      - { rule_id: API-RT-005, pointer: "probe:base-get", status: confirmed }
      - { rule_id: API-RT-006, pointer: "probe:base-get", status: confirmed }
      - { rule_id: API-RT-007, pointer: "probe:base-get", status: confirmed }
      - { rule_id: API-RT-008, pointer: "probe:not-found", status: confirmed }
      - { rule_id: API-RT-011, pointer: "probe:base-options", status: confirmed }

  - file: runtime/exposed-files.json
    kind: vulnerable
    expected:
      - { rule_id: API-RT-009, pointer: "probe:path-git-head", status: confirmed }
      - { rule_id: API-RT-009, pointer: "probe:path-env", status: confirmed }
      - { rule_id: API-RT-010, pointer: "probe:path-nginx-status", status: confirmed }
      - { rule_id: API-RT-010, pointer: "probe:path-actuator", status: confirmed }

  - file: runtime/local-http-lab.json
    kind: tricky
    expected:
      - { rule_id: API-RT-001, pointer: "probe:base-get", status: confirmed }
      - { rule_id: API-RT-005, pointer: "probe:base-get", status: confirmed }
      - { rule_id: API-RT-006, pointer: "probe:base-get", status: confirmed }
