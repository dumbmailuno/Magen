# NGX-TLS-004: plain HTTP serving content. Negatives: loopback-only listener and a server
# that redirects everything to HTTPS from `location /`.
events {}

http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name shop.example.com;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        location / {
            limit_req zone=api;
            root /srv/shop;
        }
    }

    server {
        listen 127.0.0.1:8080;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        location / {
            proxy_pass http://app;
        }
    }

    server {
        listen 80;
        server_name www.example.com;
        location / {
            return 301 https://example.com$request_uri;
        }
    }

    # No listen directive: nginx defaults to port 80.
    server {
        server_name legacy.example.com;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        root /srv/legacy;
    }
}
