# NGX-CFG-001/002/003: directory listing, exposed status/actuator, unlimited and huge bodies.
# Negatives: denied .git, auth-protected /metrics, autoindex off, an API /status path.
events {}

http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    client_max_body_size 0;

    server {
        listen 443 ssl;
        server_name files.example.com;
        limit_req zone=api;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location /files/ {
            autoindex on;
            root /srv;
        }

        location /nginx_status {
            stub_status;
        }

        location /actuator/ {
            proxy_pass http://spring;
        }

        location ~ /\.git {
            deny all;
        }

        location /metrics {
            auth_basic "metrics";
            auth_basic_user_file /etc/nginx/htpasswd;
            proxy_pass http://prom;
        }

        location /backups {
            client_max_body_size 2g;
            autoindex off;
            root /srv;
        }

        location /status {
            proxy_pass http://app;
        }
    }
}
