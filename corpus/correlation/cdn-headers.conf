# Correlation case B (static side): headers and HSTS missing in nginx, an unrestricted
# stub_status location. At runtime a CDN in front adds the headers and /nginx_status is
# blocked upstream, so the static findings are contradicted → inconclusive.
events {}

http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 443 ssl;
        server_name app.example.com;
        limit_req zone=api;

        location /nginx_status {
            stub_status;
        }

        location / {
            proxy_pass http://app;
        }
    }
}
