# Tricky but clean: path item via $ref, an external $ref (never fetched), a ref cycle,
# YAML 1.1 keys (`on`, unquoted 200) and OpenAPI 3.1 webhooks. Expected: no findings.
openapi: 3.1.0
info:
  title: Tricky refs
  version: "1.0"
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /things:
    $ref: "#/components/pathItems/Things"
  /remote:
    get:
      responses:
        200:
          $ref: "https://schemas.example.com/common.yaml#/responses/OK"
        429:
          description: Too many requests
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  pathItems:
    Things:
      get:
        responses:
          "200":
            description: OK
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/A"
  schemas:
    A:
      type: object
      properties:
        on:
          type: boolean
        b:
          $ref: "#/components/schemas/B"
    B:
      $ref: "#/components/schemas/A"
webhooks:
  newThing:
    post:
      responses:
        "200":
          description: OK
