# API-OAS-009: stack traces / exceptions in response schemas, via $ref, shared across ops.
# Negatives: traceId, debugMode, an unreferenced schema, and a recursive schema.
openapi: 3.0.3
info:
  title: Leaky errors
  version: "1.0"
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /items:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "429":
          description: Too many requests
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /other:
    get:
      responses:
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        traceId:
          type: string
        stackTrace:
          type: string
        details:
          $ref: "#/components/schemas/Debug"
    Debug:
      type: object
      properties:
        exception:
          type: string
        debugMode:
          type: boolean
    Node:
      type: object
      properties:
        name:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"
    Unused:
      type: object
      properties:
        stack:
          type: string
